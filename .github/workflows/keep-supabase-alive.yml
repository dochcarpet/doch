name: Keep Supabase alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Check if 3 days have passed
        id: check
        run: |
          LAST=$(date -u -d "3 days ago" +%s)
          echo "Three days ago: $LAST"

      - name: Ping Supabase
        run: |
          echo "Pinging Supabase..."

          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/"

          echo "Supabase ping completed."
