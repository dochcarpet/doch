<!DOCTYPE html>
<html lang="ru">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link
    rel="apple-touch-icon"
    href="images/apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="images/favicon-32x32.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="images/favicon-16x16.png"
  >

  <link
    rel="icon"
    href="images/favicon.ico"
  >

  <title>DOCH — Админ</title>



  <style>

    * {
      box-sizing: border-box;
    }



    body {
      margin: 0;
      background: #111;
      color: #f5f5f0;
      font-family: Arial, sans-serif;
    }



    button,
    input,
    textarea,
    select {
      font: inherit;
    }



    button {
      cursor: pointer;
    }



    .hidden {
      display: none !important;
    }



    /* =====================================================
       LOGIN
    ===================================================== */

    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }



    .login-box {
      width: 100%;
      max-width: 420px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 24px;
      padding: 35px;
    }



    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.08em;
      margin-bottom: 8px;
    }



    .subtitle {
      color: #999;
      margin-bottom: 30px;
    }



    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: #999;
      margin-bottom: 7px;
    }



    input,
    textarea,
    select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #111;
      color: white;
      margin-bottom: 18px;
      outline: none;
    }



    textarea {
      min-height: 110px;
      resize: vertical;
    }



    input:focus,
    textarea:focus,
    select:focus {
      border-color: #b6ff00;
    }



    .btn {
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 800;
    }



    .btn-primary {
      background: #b6ff00;
      color: #111;
    }



    .btn-dark {
      background: #292929;
      color: white;
    }



    .btn-danger {
      background: #ff4545;
      color: white;
    }



    /* =====================================================
       ADMIN
    ===================================================== */

    .admin {
      max-width: 1250px;
      margin: auto;
      padding: 25px;
    }



    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 35px;
    }



    .topbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }



    .admin-title {
      font-size: 26px;
      font-weight: 900;
    }



    .email {
      color: #888;
      font-size: 12px;
    }



    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }



    .section-head h1 {
      margin: 0;
      font-size: 22px;
    }



    /* =====================================================
       PRODUCTS
    ===================================================== */

    .products {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }



    .product {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 18px;
      overflow: hidden;
    }



    .product-image {
      aspect-ratio: 1 / 1;
      background: #252525;
      overflow: hidden;
    }



    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }



    .product-info {
      padding: 15px;
    }



    .product-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 7px;
    }



    .product-meta {
      color: #999;
      font-size: 12px;
      margin-bottom: 12px;
    }



    .status {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 6px 9px;
      border-radius: 999px;
      background: #292929;
    }



    .status.available {
      color: #b6ff00;
    }



    .status.made_to_order {
      color: #ffd166;
    }



    .status.sold {
      color: #ff7777;
    }



    .status.hidden-status {
      color: #777;
    }



    .product-actions {
      display: flex;
      gap: 7px;
      margin-top: 12px;
    }



    .product-actions button {
      flex: 1;
      padding: 9px;
      border: 0;
      border-radius: 9px;
      background: #292929;
      color: white;
      font-size: 12px;
      font-weight: 700;
    }



    /* =====================================================
       MODAL
    ===================================================== */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      overflow-y: auto;
    }



    .modal-box {
      width: 100%;
      max-width: 760px;
      background: #191919;
      border: 1px solid #333;
      border-radius: 22px;
      padding: 25px;
      margin: auto;
    }



    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }



    .modal-head h2 {
      margin: 0;
    }



    .close {
      border: 0;
      background: #292929;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      flex-shrink: 0;
    }



    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }



    .full {
      grid-column: 1 / -1;
    }



    /* =====================================================
       UPLOADS
    ===================================================== */

    .upload-box {
      border: 2px dashed #444;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      color: #aaa;
      margin-bottom: 10px;
      transition: border-color .15s;
    }



    .upload-box:hover {
      border-color: #b6ff00;
    }



    .image-list {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }



    .thumb {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 10px;
      overflow: hidden;
      background: #292929;
      flex-shrink: 0;
    }



    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }



    .thumb-delete {
      position: absolute;
      top: 5px;
      right: 5px;

      width: 27px;
      height: 27px;

      border: 0;
      border-radius: 50%;

      background: rgba(0, 0, 0, .78);
      color: white;

      font-size: 20px;
      line-height: 27px;

      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 2;
    }



    .thumb-delete:hover {
      background: #ff4545;
    }



    /* =====================================================
       MODAL ACTIONS
    ===================================================== */

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
    }



    .message {
      padding: 12px 14px;
      border-radius: 10px;
      background: #292929;
      margin-bottom: 15px;
      font-size: 13px;
    }



    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width: 700px) {

      .admin {
        padding: 15px;
      }



      .topbar {
        align-items: flex-start;
      }



      .section-head {
        align-items: stretch;
        flex-direction: column;
      }



      .section-head > div {
        width: 100%;
        flex-direction: column;
      }



      .section-head > div .btn {
        width: 100%;
        text-align: center;
      }



      .form-grid {
        grid-template-columns: 1fr;
      }



      .full {
        grid-column: auto;
      }



      .modal {
        align-items: flex-start;
        padding: 10px;
      }



      .modal-box {
        margin-top: 10px;
        padding: 18px;
        border-radius: 18px;
      }



      .modal-actions {
        flex-direction: column;
      }



      .modal-actions button {
        width: 100%;
      }



      .products {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 10px;
      }



      .product-actions {
        flex-direction: column;
      }



      .product-actions button {
        width: 100%;
      }



      .product-info {
        padding: 12px;
      }



      .product-title {
        font-size: 15px;
      }



      .thumb {
        width: 82px;
        height: 82px;
      }

    }



    @media(max-width: 420px) {

      .products {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>



<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="login-screen">

  <div class="login-box">

    <div class="logo">
      DOCH
    </div>

    <div class="subtitle">
      Админ / управление коврами
    </div>



    <form id="login-form">

      <label>
        Email
      </label>

      <input
        id="login-email"
        type="email"
        required
        autocomplete="email"
      >



      <label>
        Пароль
      </label>

      <input
        id="login-password"
        type="password"
        required
        autocomplete="current-password"
      >



      <button
        class="btn btn-primary"
        type="submit"
      >
        ВОЙТИ
      </button>

    </form>



    <div
      id="login-message"
      class="message hidden"
    ></div>

  </div>

</section>



<!-- =====================================================
     ADMIN
===================================================== -->

<section
  id="admin-screen"
  class="admin hidden"
>

  <div class="topbar">

    <div class="topbar-left">

      <div>

        <div class="admin-title">
          DOCH ADMIN
        </div>

        <div
          id="user-email"
          class="email"
        ></div>

      </div>

    </div>



    <button
      id="logout"
      class="btn btn-dark"
    >
      ВЫЙТИ
    </button>

  </div>



  <div class="section-head">

    <h1>
      Ковры
    </h1>



    <div
      style="
        display:flex;
        gap:10px;
        align-items:center;
      "
    >

      <a
        href="custom-rug.html"
        class="btn btn-dark"
        style="
          text-decoration:none;
          border:1px solid #444;
        "
      >
        ГЕНЕРАТОР КОВРОВ →
      </a>



      <button
        id="add-product"
        class="btn btn-primary"
      >
        + ДОБАВИТЬ КОВЕР
      </button>

    </div>

  </div>



  <div
    id="products"
    class="products"
  ></div>

</section>



<!-- =====================================================
     PRODUCT MODAL
===================================================== -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modal-title">
        Добавить ковер
      </h2>



      <button
        id="close-modal"
        class="close"
        type="button"
      >
        ×
      </button>

    </div>



    <form id="product-form">

      <input
        id="product-id"
        type="hidden"
      >



      <div class="form-grid">


        <!-- COVER -->

        <div class="full">

          <label>
            Обложка
          </label>

          <label class="upload-box">

            + Загрузить обложку

            <input
              id="cover-input"
              type="file"
              accept="image/*"
              hidden
            >

          </label>



          <div
            id="cover-preview"
            class="image-list"
          ></div>

        </div>



        <!-- GALLERY -->

        <div class="full">

          <label>
            Галерея
          </label>

          <label class="upload-box">

            + Добавить фотографии

            <input
              id="gallery-input"
              type="file"
              accept="image/*"
              multiple
              hidden
            >

          </label>



          <div
            id="gallery-preview"
            class="image-list"
          ></div>

        </div>



        <!-- INTERIOR -->

        <div class="full">

          <label>
            Фото интерьера
          </label>

          <label class="upload-box">

            + Загрузить фото интерьера

            <input
              id="interior-input"
              type="file"
              accept="image/*"
              hidden
            >

          </label>



          <div
            id="interior-preview"
            class="image-list"
          ></div>

        </div>



        <!-- TITLE RU -->

        <div>

          <label>
            Название RU
          </label>

          <input
            id="title-ru"
            required
          >

        </div>



        <!-- TITLE EN -->

        <div>

          <label>
            Название EN
          </label>

          <input
            id="title-en"
          >

        </div>



        <!-- DESCRIPTION RU -->

        <div class="full">

          <label>
            Описание RU
          </label>

          <textarea
            id="description-ru"
          ></textarea>

        </div>



        <!-- DESCRIPTION EN -->

        <div class="full">

          <label>
            Описание EN
          </label>

          <textarea
            id="description-en"
          ></textarea>

        </div>



        <!-- PRICE -->

        <div>

          <label>
            Цена
          </label>

          <input
            id="price"
            type="number"
            min="0"
            step="0.01"
          >

        </div>



        <!-- CURRENCY -->

        <div>

          <label>
            Валюта
          </label>

          <select id="currency">

            <option value="EUR">
              EUR
            </option>

            <option value="USD">
              USD
            </option>

            <option value="RUB">
              RUB
            </option>

            <option value="UAH">
              UAH
            </option>

          </select>

        </div>



        <!-- WIDTH -->

        <div>

          <label>
            Ширина / см
          </label>

          <input
            id="width"
            type="number"
            min="1"
          >

        </div>



        <!-- HEIGHT -->

        <div>

          <label>
            Высота / см
          </label>

          <input
            id="height"
            type="number"
            min="1"
          >

        </div>



        <!-- STATUS -->

        <div>

          <label>
            Статус
          </label>

          <select id="status">

            <option value="made_to_order">
              ПОД ЗАКАЗ
            </option>

            <option value="available">
              ДОСТУПЕН
            </option>

            <option value="sold">
              ПРОДАН
            </option>

            <option value="hidden">
              СКРЫТ
            </option>

          </select>

        </div>



        <!-- SORT -->

        <div>

          <label>
            Порядок
          </label>

          <input
            id="sort-order"
            type="number"
            value="0"
          >

        </div>



        <!-- FEATURED -->

        <div class="full">

          <label>

            <input
              id="featured"
              type="checkbox"
              style="
                width:auto;
                margin:0 8px 0 0
              "
            >

            Показывать как Featured

          </label>

        </div>

      </div>



      <div
        id="form-message"
        class="message hidden"
      ></div>



      <div class="modal-actions">

        <button
          type="button"
          id="cancel"
          class="btn btn-dark"
        >
          ОТМЕНА
        </button>



        <button
          type="submit"
          class="btn btn-primary"
        >
          СОХРАНИТЬ КОВЕР
        </button>

      </div>

    </form>

  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/admin.js"></script>


</body>
</html>
